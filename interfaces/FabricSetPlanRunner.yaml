%YAML 1.1
---
name: FabricSetPlanRunner
spec_version: 1.1
spec_type: interface
description: "This capability transfers a newly created plan from the prompt tools to the fabric through the plan server on the capabilities2 fabric
              package. This needs to be included in every fabric where a new plan for execution is expected. The capability can be triggered with a
              command such as '<Runner interface=fabric_capabilities/FabricSetPlanRunner provider=fabric_capabilities/FabricSetPlanRunner plan='$plan'/>'.
              This needs to be triggered at the very end of each plan after
              '<Runner interface=prompt_capabilities/PromptPlanRunner provider=prompt_capabilities/PromptPlanRunner replan='false' task='$task' />'
              so that the plan created by the decision making authority such as an LLM can be transferred to the capabilities2 executor
              for connection extraction and future triggering."
interface:
  services:
    "/fabric/set_plan":
      type: "fabric_msgs/srv/SetFabricPlan"
      description: "Service interface for submitting a generated execution plan to the fabric."