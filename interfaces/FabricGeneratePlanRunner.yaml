%YAML 1.1
---
name: FabricGeneratePlanRunner
spec_version: 1.2
spec_type: interface
description: "This capability generates a new plan using fabric generation action interface 
              on the fabric package. This needs to be included in every fabric where a subsequent
              plan for execution is expected. This needs to be triggered at the very end of 
              each plan to begin the new planning process for the next task. The plan generated 
              by this capability will be automatically queued in the fabric. 
interface:
  actions:
    "/fabric/plan/generate":
      type: "fabric_msgs::action::GenerateFabricPlan"
      description: "Action interface for generating a new execution plan for the fabric."