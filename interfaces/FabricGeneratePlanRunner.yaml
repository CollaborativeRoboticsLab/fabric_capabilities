%YAML 1.1
---
name: FabricGeneratePlanRunner
spec_version: 1.2
spec_type: interface
description: "This capability generates a new plan using fabric generation action interface on the fabric package. 
              This needs to be included in every fabric where a subsequent plan for execution is expected. This 
              needs to be triggered at the very end of each plan to begin the new planning process for the next task. 
              The plan generated by this capability will be automatically queued in the fabric.

              '<?xml version='1.0' encoding='UTF-8'?>' should be the first line of the xml file and it is not a part 
              of the plan. Additionally the attribute values should be enclosed within double quotes. The plan can 
              contain multiple control flows and capabilities. Keep the interface and provider attributes of the Runner 
              correctly matched with their namespace and wrong interface and provider values will result in the plan .
              being rejected.
              
              <Control type=sequential name=name_of_flow> </Control> will trigger children one after the other depending 
              on predecessor's successful completion 
              
              <Control type=parallel_any name=name_of_flow> </Control> will trigger children one after another depending 
              on predecessor's successful start up and making it psudo-parallel. All children will execute until at 
              least one capability to finishes before proceeding to execute the rest of the plan.
              
              <Control type=parallel_all name=name_of_flow> </Control> will trigger children one after another depending 
              on predecessor's successful start up and making it psudo-parallel. All children will execute until all 
              capabilities finish before proceeding to execute the rest of the plan.
              
              <Control type=recovery name=name_of_flow> </Control> will trigger children only on the immediate predecessor's 
              failure. Capabilities within recovery control flow will be executed sequentially on predecessors failure, 
              until at least one capability finishes successfully, and then rest of the recovery capabilities will be 
              skipped and the main plan will continue execution.
              
              Following example plan shows how to navigate to a series of waypoints, specifically (5.0, 5.0), (2.0,2.0) 
              and (3.0, 1.0) in order. And if the robot cannot reach point (5.0, 5.0) it can move to (0.0, 0.0) as a recovery measure.:

              '<?xml version='1.0' encoding='UTF-8'?>
                <Plan name='navigate_or_return_fabric'>
                    <Control type='sequential' name='main_execution_plan'>
                    <Runner interface='nav2_capabilities/WaypointRunner' provider='nav2_capabilities/WaypointRunner' x='5.0' y='5.0' />
                    <Control type='recovery' name='return_to_home_if_lost'>
                        <Runner interface='nav2_capabilities/WaypointRunner' provider='nav2_capabilities/WaypointRunner' x='0.0' y='0.0' />
                    </Control>
                    <Runner interface='nav2_capabilities/WaypointRunner' provider='nav2_capabilities/WaypointRunner' x='2.0' y='2.0' />
                    <Runner interface='nav2_capabilities/WaypointRunner' provider='nav2_capabilities/WaypointRunner' x='3.0' y='1.0' />
                    </Control>
                </Plan>'
              If there are multiple prompt capabilities in a plan, keep the same uuid value for all prompt capabilities in the plan. This will ensure that the LLM 
              has the context of the entire plan and can generate a new plan or speech based on the entire context."
interface:
  actions:
    "/fabric/plan/generate":
      type: "fabric_msgs::action::GeneratePlan"
      description: "Action interface for generating a new execution plan for the fabric."