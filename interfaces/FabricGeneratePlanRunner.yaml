%YAML 1.1
---
name: FabricGeneratePlanRunner
spec_version: 1.1
spec_type: interface
description: "This capability generates a new plan using fabric through the action interface on the fabric package. This needs to be included in every fabric 
              where a new plan for execution is expected. The capability can be triggered with a command such as 
              '<Runner interface=fabric_capabilities/FabricGeneratePlanRunner provider=fabric_capabilities/FabricGeneratePlanRunner task='$task', uuid='$uuid' flush='$flush' />'.
              This needs to be triggered at the very end of each plan to begin the new planning process for the next task. The plan generated by this capability will be
              queued in the fabric. The $task shows the task to be planned for, the $uuid is the unique identifier to match the correct prompt tools cache if there are additional
              information cached before or after the capability., and the $flush is a boolean to indicate whether to flush the current prompt tools cache or not. this is needed
              if this is the last capability in the plan and all information has been cached."
interface:
  services:
    "/fabric/generate_plan":
      type: "fabric_msgs/srv/GenerateFabricPlan"
      description: "Service interface for generating a new execution plan for the fabric."