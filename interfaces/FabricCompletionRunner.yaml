%YAML 1.1
---
name: FabricCompletionRunner
spec_version: 1.2
spec_type: interface
description: "This capability notifies the completion of the fabric to the fabric server. This 
              is included on every fabric as the last capability to be triggered during connection 
              identification phase. A planning entity does not need to include this generated plans
              as it is included by the fabric server itself."
interface:
  services:
    "/fabric/plan/set_completion":
      type: "fabric_msgs::srv::CompleteFabric"
      description: "Fabric completion service interface of the Fabric"